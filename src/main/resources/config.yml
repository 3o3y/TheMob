# =========================================================
#  TheMob – Global Configuration
# =========================================================
#
#  High-performance RPG mob & boss framework
#  for survival worlds, arenas and large networks.
#
#  Focus:
#   • Automation & scaling
#   • Zero exploit potential
#   • Predictable performance
#   • Admin transparency
#
# ---------------------------------------------------------
#  Version
# ---------------------------------------------------------
#  Plugin Version: v1.7
#  Config Version: v1.7
#  Status: Stable / Network Ready
#
# =========================================================

plugin:

  # -------------------------------------------------------
  # Debug & Logging
  # -------------------------------------------------------
  debug: false
  # Enables detailed logging for:
  #  • Spawn decisions
  #  • Budget blocks
  #  • Throttle state changes
  #  • Boss cooldown checks

use_spawn_egg: true

# =========================================================
#  GLOBAL SPAWN BUDGETS
# =========================================================
# Hard limits that protect server performance.
# Budgets never force-despawn mobs – they only block spawns.
# =========================================================

spawn:
  offset:
    x: 0.0
    y: 0.6
    z: 0.0
  snap-to-ground: true
  scan-down: 8
  scan-up: 6

death-messages:
  disable-vanilla: true
  custom:
    enabled: true
    message: "&c{player} &7was slain by &6{mob}"



global-budgets:
  enabled: true
  total-mobs: 500
  bosses: 10
  minions: 200
world-budgets:
  enabled: true
  worlds:
    world:
      total-mobs: 300
    world_nether:
      total-mobs: 150
    world_the_end:
      total-mobs: 100
# =========================================================
#  AUTO-SPAWN THROTTLING (TPS SAFETY)
# =========================================================
throttling:
  enabled: true
  tps-thresholds:
    normal: 19.5
    warning: 18.0
    critical: 16.0
  behavior:
    warning-multiplier: 1.25
    critical-multiplier: 1.75
    hard-stop-below-critical: true # true = no new auto spawns below critical TPS
# TPS warning is part of the built-in spawn protection system (v1.7). It prevents lag by disabling auto-spawns when TPS drops.
automation:
  feedback:
    show-to-players: false # just shown to Admins

# =========================================================
#  DYNAMIC SCALING BY PLAYER COUNT
# =========================================================

scaling:
  enabled: true
  player-ranges:
    players-1-10:
      spawn-multiplier: 0.5
    players-11-50:
      spawn-multiplier: 1.0
    players-51-150:
      spawn-multiplier: 1.3
    players-151-plus:
      spawn-multiplier: 1.5
# =========================================================
#  BOSS COOLDOWNS (PERSISTENT)
# =========================================================
# Cooldowns survive server restarts.
# Used to prevent boss farming via restarts.
# =========================================================
boss-cooldowns:
  enabled: true
  storage: file
  # file | sqlite
  data:
    zombie_king:
      next-spawn: 1700000000
# =========================================================
#  ADMIN DIAGNOSTICS
# =========================================================
diagnostics:
  enabled: true
  commands:
    show-block-reasons: true
    show-budgets: true
    show-throttle-state: true
    show-alive-mobs: true
# =========================================================
#  NAVIGATION HUD / MOB RADAR
# =========================================================
navigation-hud:
  enabled: true
  update-interval-ticks: 5
  hide-in-combat: false
  hide-when-idle: false
  hide-in-creative: false
  hide-in-spectator: true
mob-radar:
  scan-radius: 20
  scan-chunks:
    horizontal: 1
    vertical: 1
  priority:
    plugin-mobs: 1
    aggressive: 2
    neutral: 3
    passive: 4
  colors:
    plugin-mob: PURPLE
    aggressive-mob: RED
    neutral-mob: YELLOW
    passive-mob: GREEN
    empty: WHITE
  ignore:
    bats: true
    villagers: true
    named-mobs: false
# =========================================================
#  COMBAT SETTINGS
# =========================================================
# Damage Indicator
combat:
  damage-indicator:
    enabled: false
    show-to:
      - op
      - admin
# Max Critical multiplier for damage
    crit:
    max-multiplier: 10.0