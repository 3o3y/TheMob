# =========================================================
# TheMob – AutoSpawn Configuration
# =========================================================
#
# AutoSpawns create controlled mob waves for arenas,
# events or RPG zones.
#
# 🔒 AFK farming is PREVENTED by design.
# 🔁 Spawns only reset when players leave and return.
#
# Default spawn-type is FIXED_POINT.
# Other types are OPTIONAL and opt-in.
#
# =========================================================

spawns: []

  # -------------------------------------------------------
  # BASIC EXAMPLE – FIXED_POINT
  # -------------------------------------------------------
  #
  # Spawns mobs at a fixed location.
  # This is the DEFAULT and recommended starting point.
  #
  # - type: FIXED_POINT
  #   mobId: zombie_lv1
  #   intervalSeconds: 10
  #   maxSpawns: 5
  #   mode: ENDLESS
  #   world: world
  #   x: 0
  #   y: 64
  #   z: 0
  #
# =========================================================
# OPTIONAL SPAWN TYPES (disabled by default)
# =========================================================
#
# FOLLOW_PLAYER
# - Spawns mobs around a specific player
# - Player is injected by command (/mob set followplayer)
# - NEVER creates BossBars
#
# - type: FOLLOW_PLAYER
#   mobId: pig_lvl_1
#   intervalSeconds: 10
#   maxSpawns: 3
#   mode: ENDLESS
#   player: "{player}"
#   minDistance: 6
#   maxDistance: 24
#   message: "&4You feel something following you, {player}..."
#
# ---------------------------------------------------------
# RANDOM_RADIUS
# - Spawns randomly around a base point
#
# - type: RANDOM_RADIUS
#   mobId: sheep_lvl_5
#   intervalSeconds: 30
#   maxSpawns: 3
#   mode: ENDLESS
#   world: world
#   x: 100
#   y: 64
#   z: -50
#   minRadius: 8
#   maxRadius: 24
#
# ---------------------------------------------------------
# RANDOM_WORLD
# - Spawns anywhere within the world border
#
# - type: RANDOM_WORLD
#   mobId: zombie_lv3
#   intervalSeconds: 60
#   maxSpawns: 1
#   mode: ONETIME
#   world: world
#   messageIntervalSeconds: 30
#   message: "&cA dark presence roams the world..."
#
# =========================================================
# NOTES
# =========================================================
#
# mode:
#   - ENDLESS  → respawns after arena reset
#   - ONETIME  → removed after death, NOT saved
#
# All spawns are:
# ✔ reload-safe
# ✔ restart-safe
# ✔ AFK-exploit safe
#
# =========================================================