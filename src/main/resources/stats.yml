# =========================================================
#  Player Stats Menu Configuration
#  Plugin: TheMob
#  Status: Production Ready (PvE Balanced)
# =========================================================
#
#  This file controls:
#   • The in-game player stats GUI
#   • Stat display layout (icons, slots, names)
#   • Stat progression via tier systems (Lv1–Lv10)
#
#  This file is designed for SERVER ADMINS.
#  You can safely tweak values without touching code.
#
# ---------------------------------------------------------
#  GENERAL RULES
# ---------------------------------------------------------
#  • Slots range from 0–53 (6 rows inventory)
#  • Removing a stat entry disables it completely
#  • Tier arrays define how stats scale per level
#  • Tier index = stat level (Lv1 = index 0)
# =========================================================


# =========================================================
#  STATS MENU (GUI)
# =========================================================
menu:

  # Title shown at the top of the stats inventory
  title: "Your Stats"

  # Inventory size (must be multiple of 9)
  # 54 = 6 rows (recommended)
  size: 54


# =========================================================
#  STATS DEFINITIONS
# =========================================================
#
#  Each stat entry defines:
#   • Display name
#   • Inventory slot
#   • Value path (current value)
#   • Level path (current stat level)
#   • Next path (value for next level)
#   • Icon material
#
#  You can reorder stats by changing the slot.
# =========================================================

stats:

  # -------------------------------------------------------
  # BASE HEALTH
  # -------------------------------------------------------
  # Represents the player's base maximum health.
  # This is the foundation of survivability.
  #
  health:
    name: "❤ Health"
    slot: 0
    value-path: "player.health"
    level-path: "player.level.health"
    next-path: "player.next.health"
    icon: "HEART_OF_THE_SEA"


  # -------------------------------------------------------
  # BONUS HEALTH
  # -------------------------------------------------------
  # Extra health added on top of base health.
  # Usually granted by items, perks or buffs.
  #
  bonus_health:
    name: "❤+ Health+"
    slot: 10
    value-path: "player.bonus_health"
    level-path: "player.level.health"
    next-path: "player.next.health"
    icon: "GOLDEN_APPLE"


  # -------------------------------------------------------
  # ARMOR (VANILLA ARMOR POINTS)
  # -------------------------------------------------------
  # Works exactly like vanilla armor.
  # Strong mitigation – values above 20 are NOT recommended.
  #
  armor:
    name: "⛨ Defense"
    slot: 45
    value-path: "player.armor"
    level-path: "player.level.armor"
    next-path: "player.next.armor"
    icon: "SHIELD"


  # -------------------------------------------------------
  # ADVANCED DEFENSE (RPG)
  # -------------------------------------------------------
  # Custom RPG-style defense.
  # Uses diminishing returns in combat formulas.
  #
  defense:
    name: "⛨+ Defense+"
    slot: 37
    value-path: "player.defense"
    level-path: "player.level.defense"
    next-path: "player.next.defense"
    icon: "NETHERITE_SCRAP"


  # -------------------------------------------------------
  # BASE DAMAGE
  # -------------------------------------------------------
  # Flat damage added to vanilla weapon damage.
  # Core offensive stat.
  #
  damage:
    name: "⚔ Damage"
    slot: 5
    value-path: "player.damage"
    level-path: "player.level.damage"
    next-path: "player.next.damage"
    icon: "DIAMOND"


  # -------------------------------------------------------
  # EXTRA DAMAGE (ADDITIVE)
  # -------------------------------------------------------
  # Additional flat damage added AFTER base damage.
  # Keep this lower than base damage to avoid burst meta.
  #
  extra_damage:
    name: "⚔ Extra Dmg"
    slot: 8
    value-path: "player.extra_damage"
    level-path: "player.level.extra_damage"
    next-path: "player.next.extra_damage"
    icon: "ANVIL"


  # -------------------------------------------------------
  # CRITICAL HIT CHANCE
  # -------------------------------------------------------
  # Chance (in %) to deal a critical hit.
  # Internally normalized (e.g. 30 = 30%).
  #
  crit_chance:
    name: "✨ Crit Chance"
    slot: 43
    value-path: "player.crit_chance"
    level-path: "player.level.crit"
    next-path: "player.next.crit"
    icon: "AMETHYST_SHARD"


  # -------------------------------------------------------
  # CRITICAL DAMAGE MULTIPLIER
  # -------------------------------------------------------
  # Increases damage when a crit occurs.
  # Values are interpreted as percentage.
  #
  crit_multiplier:
    name: "✨ Crit Multiplier"
    slot: 53
    value-path: "player.crit_multiplier"
    level-path: "player.level.crit_multiplier"
    next-path: "player.next.crit_multiplier"
    icon: "GLOWSTONE_DUST"


  # -------------------------------------------------------
  # LIFESTEAL
  # -------------------------------------------------------
  # Converts a percentage of dealt damage into health.
  # Hard capped in combat config (recommended ≤ 35%).
  #
  lifesteal:
    name: "⚡ Lifesteal"
    slot: 16
    value-path: "player.lifesteal"
    level-path: "player.level.lifesteal"
    next-path: "player.next.lifesteal"
    icon: "NETHER_WART"


  # -------------------------------------------------------
  # MOVEMENT SPEED
  # -------------------------------------------------------
  # Adds to vanilla movement speed.
  # Small values have big gameplay impact.
  #
  movement_speed:
    name: "🩸 Move Speed"
    slot: 20
    value-path: "player.movement_speed"
    level-path: "player.level.movement_speed"
    next-path: "player.next.movement_speed"
    icon: "DIAMOND_BOOTS"


  # -------------------------------------------------------
  # ATTACK SPEED
  # -------------------------------------------------------
  # Adds to vanilla attack speed.
  # High values drastically increase DPS.
  #
  attack_speed:
    name: "⚡ Attack Speed"
    slot: 24
    value-path: "player.attack_speed"
    level-path: "player.level.attack_speed"
    next-path: "player.next.attack_speed"
    icon: "WIND_CHARGE"


  # -------------------------------------------------------
  # LUCK
  # -------------------------------------------------------
  # Influences drops, RNG rolls and special events.
  #
  luck:
    name: "🍀 Luck"
    slot: 29
    value-path: "player.luck"
    level-path: "player.level.luck"
    next-path: "player.next.luck"
    icon: "RABBIT_FOOT"


  # -------------------------------------------------------
  # KNOCKBACK RESISTANCE
  # -------------------------------------------------------
  # Range: 0.0 – 1.0
  # 1.0 = immune to knockback
  #
  knockback_resistance:
    name: "🛑 Knockback Res."
    slot: 33
    value-path: "player.knockback_resistance"
    level-path: "player.level.knockback_resistance"
    next-path: "player.next.knockback_resistance"
    icon: "HEAVY_CORE"


# =========================================================
