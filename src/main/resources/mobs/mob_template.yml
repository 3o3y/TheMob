# =========================================================
# TheMob – Mob Configuration Example
# =========================================================
#
# This file defines a CUSTOM MOB.
# It can be used for arenas, events or RPG worlds.
#
# The mob behavior, stats, drops and rewards
# are fully configurable.
#
# =========================================================

mob-id: zombie_mob_template            # Unique ID (file name or explicit)
base-type: ZOMBIE                      # Vanilla entity type

# ---------------------------------------------------------
# Display
# ---------------------------------------------------------
name: "&b&lZombie"             # Colored mob name
display-health: true           # Show health above mob (HUD)

equipment:                     # equipment will not drop!
  helmet:
    chance: 1.0                # Chance to equip the mob
    type: HEAD_TEXTURE
    value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjE1ZjM1MTdmMjg3NDA0NzBlOGY1MWI0ZDc1NWJlMTU5ZWU2NTg2MWMwNWUyZjc0NGZiNjFiZmRjY2Q1YzBlMSJ9fX0="

  chestplate:
    chance: 0.6
    material: GOLDEN_CHESTPLATE

  leggings:
    chance: 0.8
    material: IRON_LEGGINGS

  boots:
    material: IRON_BOOTS        # equipment chance = 1.0 (default)

  main-hand:
    chance: 1.0
    material: IRON_SWORD

  off-hand:
    chance: 1.0
    material: SHIELD

# ---------------------------------------------------------
# Stats
# ---------------------------------------------------------
stats:
  health:
    max: 20                    # Max health (10 hearts)
    current: 20                # Spawn health
  movement-speed: 0.23         # Vanilla = ~0.23
  attack-damage: 0             # 0 = harmless (good for events / early game)
  scale: 0.8                   # Entity size multiplier (1.0 = default size)

# ---------------------------------------------------------
# AI & BEHAVIOR (v1.8)
# ---------------------------------------------------------
ai:

  # -----------------------
  # TARGETING LOGIC
  # -----------------------
  targeting:
    type: SMART                 # SMART | NEAREST | RANDOM (future)
    max-distance: 16            # Max range to search for players
    switch-cooldown: 40         # Ticks before target can change again

  # -----------------------
  # AGGRESSION DISTANCES
  # -----------------------
  aggression:
    engage-distance: 14         # Start attacking if target is closer
    disengage-distance: 22      # Stop chasing if target is too far away

  # -----------------------
  # FLEE / REGROUP LOGIC
  # -----------------------
  flee:
    enabled: false              # Enable flee behavior
    health-below: 0.25          # % of max health (0.25 = 25%)
    regroup-after: 80           # Ticks before re-engaging

  # -----------------------
  # AI PERFORMANCE CONTROL
  # -----------------------
  throttle:
    tick-rate: 10               # AI logic runs every X ticks
    # (10 = every 0.5 seconds)


# ---------------------------------------------------------
# Death Commands
# ---------------------------------------------------------
# Executed when a PLAYER kills this mob
# Placeholders like {player} are supported
death-commands:
  - "give {player} carrot 1"

# ---------------------------------------------------------
# XP Settings
# ---------------------------------------------------------
# The amount of experience the player receives upon killing this mob.
# This value determines how much or how big XP orbs are dropped when the mob dies.
# Useful for balancing mob rewards in progression systems.
xp: 10


# ---------------------------------------------------------
# Drops
# ---------------------------------------------------------
# Drops are rolled independently
# chance = 1.0 means 100%
# chance = 0.5 means 50%
#
# No vanilla drops are used – ONLY these
# ---------------------------------------------------------
drops:
  - item: ROTTEN_FLESH
    amount: 2
    chance: 1.0                # Always drops
  - item: BONE
    amount: 3
    chance: 0.8                # 80% chance
  - item: STRING
    amount: 4
    chance: 0.6                # 60% chance
  - item: STICK
    amount: 2
    chance: 0.4                # 40% chance
  - item: GOLDEN_APPLE
    amount: 1
    chance: 0.12               # Rare drop (12%)
  - item: DIAMOND
    amount: 1
    chance: 0.08               # Very rare (8%)
  - item: GOLDEN_CARROT
    amount: 1
    chance: 0.04               # Ultra rare (4%)

# ---------------------------------------------------------
# Notes for Admins
# ---------------------------------------------------------
#
# ✔ This mob can be used safely in AutoSpawns
# ✔ Drops are balanced for early / mid game
# ✔ No AFK farming possible (AutoSpawn controlled)
#
# Tip:
# Use this mob as a base template
# and scale stats + drops for higher tiers.
#
# =========================================================
